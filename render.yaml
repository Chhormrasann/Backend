services:
  # Backend Web Service
  - type: web
    name: ai-chatbot-backend
    env: node
    plan: free
    repo: https://github.com/Chhormrasann/Backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5001
      - key: HF_API_KEY
        sync: false # Set in Render dashboard

  # Frontend Static Site
  - type: static
    name: ai-chatbot-frontend
    env: static
    plan: free
    repo: https://github.com/Chhormrasann/Frontend
    buildCommand: npm install && npm run build
    staticPublishDir: dist
    envVars:
      - key: VITE_API_URL
        sync: false # Set in Render dashboard (point to the backend URL)
